<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080a14" />
      <stop offset="40%" stop-color="#0d1127" />
      <stop offset="80%" stop-color="#11183c" />
      <stop offset="100%" stop-color="#090d1f" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f3e8ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 17px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 0.8px;
    }

    /* Waveform Animation */
    @keyframes wavePulse {
      0%, 100% { height: 18px; y: 311px; opacity: 0.4; }
      50% { height: 75px; y: 254px; opacity: 0.95; }
    }
    @keyframes wavePulseAlt {
      0%, 100% { height: 60px; y: 269px; opacity: 0.8; }
      50% { height: 15px; y: 314px; opacity: 0.35; }
    }
    @keyframes orbitPulse {
      0%, 100% { transform: translateY(0px) scale(1); opacity: 0.35; }
      50% { transform: translateY(-10px) scale(1.05); opacity: 0.6; }
    }
    @keyframes pillFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .orb-1 { animation: orbitPulse 8s ease-in-out infinite; }
    .orb-2 { animation: orbitPulse 10s ease-in-out infinite reverse; }

    .bar-1 { animation: wavePulse 1.4s ease-in-out infinite 0.1s; }
    .bar-2 { animation: wavePulseAlt 1.2s ease-in-out infinite 0.25s; }
    .bar-3 { animation: wavePulse 1.6s ease-in-out infinite 0.4s; }
    .bar-4 { animation: wavePulseAlt 1.1s ease-in-out infinite 0.15s; }
    .bar-5 { animation: wavePulse 1.5s ease-in-out infinite 0.35s; }
    .bar-6 { animation: wavePulseAlt 1.3s ease-in-out infinite 0.5s; }
    .bar-7 { animation: wavePulse 1.7s ease-in-out infinite 0.2s; }
    .bar-8 { animation: wavePulseAlt 1.4s ease-in-out infinite 0.45s; }
    .bar-9 { animation: wavePulse 1.2s ease-in-out infinite 0.6s; }
    .bar-10 { animation: wavePulseAlt 1.5s ease-in-out infinite 0.3s; }
    .bar-11 { animation: wavePulse 1.3s ease-in-out infinite 0.1s; }
    .bar-12 { animation: wavePulseAlt 1.6s ease-in-out infinite 0.4s; }

    .floating-badge { animation: pillFloat 4s ease-in-out infinite; }
    .floating-badge-delay { animation: pillFloat 4s ease-in-out infinite 2s; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="400" rx="20" fill="url(#bgGradient)" />

  <!-- Ambient Glow Orbs in Background -->
  <g class="orb-1">
    <circle cx="220" cy="100" r="150" fill="#6366f1" opacity="0.18" filter="url(#glow)" />
  </g>
  <g class="orb-2">
    <circle cx="980" cy="280" r="180" fill="#ec4899" opacity="0.14" filter="url(#glow)" />
    <circle cx="800" cy="120" r="130" fill="#06b6d4" opacity="0.15" filter="url(#glow)" />
  </g>

  <!-- Tech Grid / Modern Background Pattern -->
  <g opacity="0.07" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="320" x2="1200" y2="320" />
    <line x1="200" y1="0" x2="200" y2="400" />
    <line x1="400" y1="0" x2="400" y2="400" />
    <line x1="600" y1="0" x2="600" y2="400" />
    <line x1="800" y1="0" x2="800" y2="400" />
    <line x1="1000" y1="0" x2="1000" y2="400" />
  </g>

  <!-- Sleek Border Frame -->
  <rect x="1.5" y="1.5" width="1197" height="397" rx="19" fill="none" stroke="url(#primaryGlow)" stroke-width="2" opacity="0.4" />

  <!-- Dynamic Equalizer / Speech Waveform in Background/Lower Section -->
  <g filter="url(#softGlow)">
    <!-- Left Wave Cluster -->
    <rect class="bar-1" x="120" y="290" width="8" height="35" rx="4" fill="#6366f1" />
    <rect class="bar-2" x="136" y="280" width="8" height="55" rx="4" fill="#818cf8" />
    <rect class="bar-3" x="152" y="270" width="8" height="75" rx="4" fill="#a855f7" />
    <rect class="bar-4" x="168" y="285" width="8" height="45" rx="4" fill="#c084fc" />
    <rect class="bar-5" x="184" y="295" width="8" height="25" rx="4" fill="#ec4899" />

    <!-- Center Wide Ambient Wave Spectrum -->
    <rect class="bar-6" x="420" y="295" width="10" height="25" rx="5" fill="#06b6d4" />
    <rect class="bar-7" x="440" y="280" width="10" height="55" rx="5" fill="#38bdf8" />
    <rect class="bar-8" x="460" y="265" width="10" height="85" rx="5" fill="#6366f1" />
    <rect class="bar-9" x="480" y="255" width="10" height="105" rx="5" fill="#8b5cf6" />
    <rect class="bar-10" x="500" y="270" width="10" height="75" rx="5" fill="#a855f7" />
    <rect class="bar-11" x="520" y="260" width="10" height="95" rx="5" fill="#d946ef" />
    <rect class="bar-12" x="540" y="275" width="10" height="65" rx="5" fill="#ec4899" />
    <rect class="bar-1" x="560" y="285" width="10" height="45" rx="5" fill="#f43f5e" />
    <rect class="bar-2" x="580" y="290" width="10" height="35" rx="5" fill="#fb7185" />
    <rect class="bar-3" x="600" y="265" width="10" height="85" rx="5" fill="#818cf8" />
    <rect class="bar-4" x="620" y="255" width="10" height="105" rx="5" fill="#6366f1" />
    <rect class="bar-5" x="640" y="270" width="10" height="75" rx="5" fill="#06b6d4" />
    <rect class="bar-6" x="660" y="285" width="10" height="45" rx="5" fill="#38bdf8" />
    <rect class="bar-7" x="680" y="292" width="10" height="30" rx="5" fill="#a855f7" />
    <rect class="bar-8" x="700" y="280" width="10" height="55" rx="5" fill="#ec4899" />
    <rect class="bar-9" x="720" y="268" width="10" height="78" rx="5" fill="#c084fc" />
    <rect class="bar-10" x="740" y="288" width="10" height="40" rx="5" fill="#818cf8" />
    <rect class="bar-11" x="760" y="295" width="10" height="25" rx="5" fill="#06b6d4" />

    <!-- Right Wave Cluster -->
    <rect class="bar-12" x="1010" y="290" width="8" height="35" rx="4" fill="#ec4899" />
    <rect class="bar-1" x="1026" y="275" width="8" height="65" rx="4" fill="#d946ef" />
    <rect class="bar-2" x="1042" y="265" width="8" height="85" rx="4" fill="#a855f7" />
    <rect class="bar-3" x="1058" y="280" width="8" height="55" rx="4" fill="#6366f1" />
    <rect class="bar-4" x="1074" y="292" width="8" height="30" rx="4" fill="#38bdf8" />
  </g>

  <!-- FOREGROUND CONTENT: Header Category Tag -->
  <g class="floating-badge" transform="translate(80, 52)">
    <rect width="320" height="34" rx="17" fill="#1e1b4b" stroke="#4338ca" stroke-width="1.5" />
    <circle cx="18" cy="17" r="5" fill="#10b981" />
    <text x="34" y="22" class="tag-text" fill="#a5b4fc">AI AUDIO &amp; SPEECH ECOSYSTEM</text>
  </g>

  <!-- FOREGROUND CONTENT: Main Title & Subtitle -->
  <!-- Microphone & Soundwave Icon Badge -->
  <g transform="translate(80, 108)">
    <rect width="56" height="56" rx="16" fill="url(#primaryGlow)" opacity="0.2" />
    <rect x="1" y="1" width="54" height="54" rx="15" fill="#0f172a" stroke="url(#primaryGlow)" stroke-width="1.5" />
    <!-- SVG Mic Icon -->
    <path d="M28 17 C25.8 17 24 18.8 24 21 L24 29 C24 31.2 25.8 33 28 33 C30.2 33 32 31.2 32 29 L32 21 C32 18.8 30.2 17 28 17 Z" fill="#a855f7" />
    <path d="M20 27 C20 31.4 23.6 35 28 35 C32.4 35 36 31.4 36 27" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <line x1="28" y1="35" x2="28" y2="41" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
    <line x1="23" y1="41" x2="33" y2="41" stroke="#ec4899" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <g transform="translate(150, 142)">
    <text class="title">Multimodal Voice AI &amp; Speech Synthesis</text>
    <text y="34" class="subtitle">Neural TTS • Zero-Shot Voice Cloning • Expressive Speech LLMs • Low-Latency Audio Streaming</text>
  </g>

  <!-- Feature Pills Badges (Floating Lower Foreground) -->
  <g class="floating-badge" transform="translate(80, 218)">
    <rect width="155" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" class="tag-text" fill="#38bdf8">&#9889; Low-Latency S2S</text>
  </g>

  <g class="floating-badge-delay" transform="translate(250, 218)">
    <rect width="170" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" class="tag-text" fill="#c084fc">&#127917; Emotion &amp; Prosody</text>
  </g>

  <g class="floating-badge" transform="translate(435, 218)">
    <rect width="175" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" class="tag-text" fill="#f472b6">&#127908; Zero-Shot Cloning</text>
  </g>

  <g class="floating-badge-delay" transform="translate(625, 218)">
    <rect width="150" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" class="tag-text" fill="#fbbf24">&#128257; Cross-Lingual</text>
  </g>

  <g class="floating-badge" transform="translate(790, 218)">
    <rect width="165" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" class="tag-text" fill="#34d399">&#128421;&#65039; On-Device / Edge</text>
  </g>

  <g class="floating-badge-delay" transform="translate(970, 218)">
    <rect width="150" height="32" rx="16" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="20" y="21" class="tag-text" fill="#a78bfa">&#129302; Conversational</text>
  </g>
</svg>